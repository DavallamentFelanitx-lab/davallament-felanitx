# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# ============================================================================
# SVELTIA CMS — Associació El Davallament de Felanitx
# ============================================================================
# Accés al gestor:
#   - En local:        http://127.0.0.1:8096/admin/  ("Treballa amb el repositori local" a Chrome/Edge)
#   - A GitHub Pages:  https://davallamentfelanitx-lab.github.io/davallament-felanitx/admin/
#                      (Inicia sessió amb un Personal Access Token de GitHub o via OAuth Worker)

backend:
  name: github
  repo: DavallamentFelanitx-lab/davallament-felanitx
  branch: main
  # Opcional: si en un futur desplegues un Cloudflare Worker (sveltia-cms-auth) per a OAuth amb 1 clic:
  # base_url: https://el-teu-worker.workers.dev

site_url: https://davallamentfelanitx-lab.github.io/davallament-felanitx/
logo_url: ../img/logo/logo.png
locale: ca

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "contingut"
    label: "Contingut del web"
    label_singular: "Secció"
    files:
      # ----------------------------------------------------------------------
      # 0. INICI — CARRUSEL PRINCIPAL / HERO (data/hero.yaml)
      # ----------------------------------------------------------------------
      - name: "hero"
        label: "Inici · Carrusel principal (Hero)"
        file: "data/hero.yaml"
        description: "Fotografies i textos del carrusel gran de la pàgina d'inici. Pots reordenar-les, canviar les fotos o afegir-ne de noves."
        fields:
          - name: "items"
            label: "Diapositives del carrusel"
            label_singular: "Diapositiva"
            widget: "list"
            summary: "{{fields.titol}}"
            fields:
              - { name: "imatge", label: "Fotografia", widget: "image", media_folder: "/img/hero", public_folder: "img/hero" }
              - { name: "etiqueta", label: "Etiqueta superior (opcional)", widget: "string", required: false }
              - { name: "titol", label: "Títol gran", widget: "string", required: false }
              - { name: "subtitol", label: "Subtítol descriptiu (opcional)", widget: "text", required: false }

      # ----------------------------------------------------------------------
      # 1. NOTÍCIES (data/noticies.yaml)
      # ----------------------------------------------------------------------
      - name: "noticies"
        label: "Notícies"
        file: "data/noticies.yaml"
        description: "Afegeix, edita o elimina notícies. S'ordenen automàticament per data i la més recent surt destacada."
        fields:
          - name: "items"
            label: "Llistat de notícies"
            label_singular: "Notícia"
            widget: "list"
            summary: "{{fields.dataIso}} · {{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador (sense espais)", widget: "string", hint: "Exemple: edicio-2027-cronica" }
              - { name: "titol", label: "Titular", widget: "string" }
              - { name: "categoria", label: "Categoria", widget: "string", default: "Actualitat" }
              - { name: "data", label: "Data visible", widget: "string", hint: "Exemple: 26 de març de 2027" }
              - { name: "dataIso", label: "Data per ordenar (AAAA-MM-DD)", widget: "string", hint: "Exemple: 2027-03-26" }
              - { name: "destacada", label: "Destacada", widget: "boolean", default: false, required: false }
              - { name: "imatge", label: "Fotografia principal (Foto 1)", widget: "image", media_folder: "/img/noticies", public_folder: "img/noticies" }
              - { name: "cartell", label: "Segona fotografia o cartell (Foto 2, opcional)", widget: "image", media_folder: "/img/noticies", public_folder: "img/noticies", required: false }
              - { name: "imatge3", label: "Tercera fotografia (Foto 3, opcional)", widget: "image", media_folder: "/img/noticies", public_folder: "img/noticies", required: false }
              - { name: "font", label: "Font / Mitjà (opcional)", widget: "string", required: false }
              - { name: "fontUrl", label: "Enllaç a la font (opcional)", widget: "string", required: false }
              - { name: "resum", label: "Resum breu (targeta)", widget: "text" }
              - name: "etiquetes"
                label: "Etiquetes"
                widget: "list"
                required: false
                field: { name: "etiqueta", label: "Etiqueta", widget: "string" }
              - name: "cos"
                label: "Paràgrafs de la notícia"
                widget: "list"
                field: { name: "paragraf", label: "Paràgraf", widget: "text" }

      # ----------------------------------------------------------------------
      # 2. GALERIA DE FOTOGRAFIES (data/galeria.yaml)
      # ----------------------------------------------------------------------
      - name: "galeria"
        label: "Galeria de fotografies"
        file: "data/galeria.yaml"
        description: "Fotografies que apareixen a la pàgina Galeria amb filtres per etiqueta i per any, i visor a pantalla completa."
        fields:
          - name: "items"
            label: "Fotografies"
            label_singular: "Fotografia"
            widget: "list"
            summary: "{{fields.album}} · {{fields.any}} · {{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador (opcional, sense espais)", widget: "string", required: false }
              - { name: "titol", label: "Títol de la fotografia (opcional)", widget: "string", required: false }
              - { name: "album", label: "Etiqueta / Àlbum", widget: "string", required: false, hint: "Exemple: Entrada a Jerusalem, Davallament, Verònica, Jesús davant Pilat" }
              - { name: "any", label: "Any o edició (opcional)", widget: "string", required: false, hint: "Exemple: 2026, 2025, 2023" }
              - { name: "lloc", label: "Lloc (opcional)", widget: "string", required: false }
              - { name: "credit", label: "Autoria / Crèdit (opcional)", widget: "string", required: false }
              - { name: "imatge", label: "Imatge", widget: "image", media_folder: "/img/galeria", public_folder: "img/galeria" }
              - { name: "descripcio", label: "Peu de foto (opcional)", widget: "text", required: false }

      # ----------------------------------------------------------------------
      # 3. MULTIMÈDIA — VÍDEOS DE YOUTUBE (data/multimedia.yaml)
      # ----------------------------------------------------------------------
      - name: "multimedia"
        label: "Multimèdia (Vídeos YouTube)"
        file: "data/multimedia.yaml"
        description: "Vídeos de YouTube incrustats a l'apartat Multimèdia de Galeria."
        fields:
          - name: "items"
            label: "Vídeos"
            label_singular: "Vídeo"
            widget: "list"
            summary: "{{fields.any}} · {{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador (sense espais)", widget: "string" }
              - { name: "titol", label: "Títol del vídeo", widget: "string" }
              - { name: "any", label: "Any", widget: "string", required: false }
              - { name: "font", label: "Canal o font", widget: "string", required: false }
              - { name: "youtubeUrl", label: "Enllaç de YouTube", widget: "string", hint: "Enganxa qualsevol URL de YouTube (ex: https://www.youtube.com/watch?v=...)" }
              - { name: "descripcio", label: "Descripció", widget: "text", required: false }

      # ----------------------------------------------------------------------
      # 4. JUNTA DIRECTIVA (data/junta.yaml)
      # ----------------------------------------------------------------------
      - name: "junta"
        label: "Junta Directiva"
        file: "data/junta.yaml"
        description: "Membres de la Junta Directiva que es mostren a la pàgina L'entitat."
        fields:
          - name: "items"
            label: "Membres de la Junta"
            label_singular: "Membre"
            widget: "list"
            summary: "{{fields.carrec}} — {{fields.nom}}"
            fields:
              - { name: "id", label: "Identificador (sense espais)", widget: "string" }
              - { name: "carrec", label: "Càrrec", widget: "string" }
              - { name: "nom", label: "Nom i llinatges", widget: "string" }
              - { name: "area", label: "Àrea o tasca principal", widget: "text", required: false }

      # ----------------------------------------------------------------------
      # 5. CONVOCATÒRIES I ASSEMBLEES (data/convocatories.yaml)
      # ----------------------------------------------------------------------
      - name: "convocatories"
        label: "Convocatòries i assemblees"
        file: "data/convocatories.yaml"
        description: "Reunions i assemblees de l'Associació (secció actualment comentada a entitat.html)."
        fields:
          - name: "items"
            label: "Convocatòries"
            label_singular: "Convocatòria"
            widget: "list"
            summary: "{{fields.estat}} · {{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador (sense espais)", widget: "string" }
              - { name: "titol", label: "Títol de la convocatòria", widget: "string" }
              - { name: "estat", label: "Estat", widget: "select", options: ["proxima", "realitzada"], default: "proxima" }
              - { name: "data", label: "Data visible", widget: "string" }
              - { name: "dataIso", label: "Data per ordenar (AAAA-MM-DD)", widget: "string" }
              - { name: "hora", label: "Hora", widget: "string", required: false }
              - { name: "lloc", label: "Lloc", widget: "string", required: false }
              - { name: "adrecatA", label: "Adreçat a", widget: "string", required: false }
              - { name: "resum", label: "Resum", widget: "text", required: false }
              - name: "ordreDelDia"
                label: "Ordre del dia"
                widget: "list"
                required: false
                field: { name: "punt", label: "Punt", widget: "string" }

      # ----------------------------------------------------------------------
      # 6. LA REPRESENTACIÓ — TEXT, BANDA SONORA I POSADA EN ESCENA
      # ----------------------------------------------------------------------
      - name: "representacio"
        label: "La representació (Text, Banda sonora i Posada en escena)"
        file: "data/representacio.yaml"
        description: "Edita les subseccions El text, La banda sonora i La posada en escena de la pàgina Representació."
        fields:
          - name: "items"
            label: "Subseccions de La representació"
            label_singular: "Subsecció"
            widget: "list"
            summary: "{{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador / àncora (no canviar)", widget: "string", hint: "text | banda-sonora | posada-en-escena" }
              - { name: "etiqueta", label: "Subtítol superior (etiqueta)", widget: "string", required: false }
              - { name: "titol", label: "Títol de la subsecció", widget: "string" }
              - { name: "imatge", label: "Fotografia (opcional)", widget: "image", media_folder: "/img/representacio", public_folder: "img/representacio", required: false }
              - name: "paragrefs"
                label: "Paràgrafs"
                widget: "list"
                field: { name: "paragraf", label: "Paràgraf", widget: "text" }
              - { name: "cita", label: "Cita destacada (opcional)", widget: "text", required: false }
              - { name: "autorCita", label: "Autor o referència de la cita (opcional)", widget: "string", required: false }
              - { name: "spotifyUrl", label: "Enllaç a Spotify (botó, opcional)", widget: "string", required: false, hint: "Exemple: https://open.spotify.com/album/..." }
              - { name: "youtubeUrl", label: "Enllaç a YouTube (botó, opcional)", widget: "string", required: false, hint: "Exemple: https://www.youtube.com/playlist?list=..." }

      # ----------------------------------------------------------------------
      # 7. LA REPRESENTACIÓ — ESCENA PER ESCENA (data/escenes.yaml)
      # ----------------------------------------------------------------------
      - name: "escenes"
        label: "La representació · Escena per escena"
        file: "data/escenes.yaml"
        description: "Edita, afegeix o elimina les escenes del recorregut. Tots els camps són opcionals."
        fields:
          - name: "items"
            label: "Escenes de la representació"
            label_singular: "Escena"
            widget: "list"
            summary: "{{fields.numero}} · {{fields.titol}}"
            fields:
              - { name: "id", label: "Identificador (opcional)", widget: "string", required: false }
              - { name: "numero", label: "Número o ordre (ex: I, II, III...)", widget: "string", required: false }
              - { name: "titol", label: "Títol de l'escena", widget: "string", required: false }
              - { name: "lloc", label: "Ubicació a l'escalinata", widget: "string", required: false }
              - { name: "imatge", label: "Fotografia principal (Foto 1)", widget: "image", media_folder: "/img/representacio", public_folder: "img/representacio", required: false }
              - { name: "imatge2", label: "Segona fotografia (Foto 2, opcional)", widget: "image", media_folder: "/img/representacio", public_folder: "img/representacio", required: false }
              - { name: "imatge3", label: "Tercera fotografia (Foto 3, opcional)", widget: "image", media_folder: "/img/representacio", public_folder: "img/representacio", required: false }
              - { name: "descripcio", label: "Descripció de l'escena", widget: "text", required: false }
              - { name: "atmosfera", label: "Atmosfera / Il·luminació", widget: "string", required: false }
              - { name: "audioUrl", label: "Música de l'escena (Spotify, YouTube o MP3, opcional)", widget: "string", required: false, hint: "Enganxa l'enllaç de la cançó de Spotify (ex: https://open.spotify.com/track/...), YouTube o .mp3" }
              - { name: "albumGaleria", label: "Àlbum de la Galeria (opcional)", widget: "string", required: false, hint: "Si es deixa buit, filtrarà la Galeria pel títol de l'escena (ex: Entrada a Jerusalem)" }
              - name: "personatges"
                label: "Personatges"
                widget: "list"
                required: false
                field: { name: "personatge", label: "Personatge", widget: "string", required: false }

      # ----------------------------------------------------------------------
      # 7. HISTÒRIA — LÍNIA TEMPORAL (data/cronologia.yaml)
      # ----------------------------------------------------------------------
      - name: "cronologia"
        label: "Història · Línia temporal (1975–2026)"
        file: "data/cronologia.yaml"
        description: "Fites històriques mostrades a la línia temporal de la pàgina Història."
        fields:
          - name: "items"
            label: "Fites històriques"
            label_singular: "Fita"
            widget: "list"
            summary: "{{fields.any}} · {{fields.titol}}"
            fields:
              - { name: "any", label: "Any o període", widget: "string" }
              - { name: "titol", label: "Títol de la fita", widget: "string" }
              - { name: "text", label: "Descripció", widget: "text" }
