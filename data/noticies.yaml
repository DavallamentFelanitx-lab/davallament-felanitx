  lectura: "3 min"
  destacada: false
  imatge: "img/hero/hero3.jpg"
  resum: "L'Associació convida veïns i veïnes de totes les edats a sumar-se als assajos i als tallers de preparació per mantenir viu el relleu generacional."
  etiquetes: ["Voluntariat", "Assajos", "Associació"]
