# ============================================================================
# NOTÍCIES — Associació El Davallament de Felanitx
# ============================================================================
# Les notícies s'ordenen automàticament per ordre cronològic (de més recent a més antiga).
#
# Com afegir una notícia nova:
#   1. Copia una fitxa completa (des de "- id:" fins al darrer paràgraf de "cos:")
#   2. Omple els camps (recomanam posar "dataIso: YYYY-MM-DD" per a una ordenació exacta).
#   3. Desa el fitxer (o fes "Commit changes" directament a GitHub).
#
# Camps:
#   id:         identificador únic sense espais ni accents (ex: edicio-2027)
#   titol:      titular de la notícia (entre cometes)
#   categoria:  Edició 2026 | Cròniques | 50è Aniversari | Convocatòries | Patrimoni i Cultura
#   data:       data visible (ex: "26 de març de 2027")
#   dataIso:    data numèrica per ordenar (ex: "2027-03-26")
#   lectura:    temps estimat (ex: "3 min")
#   destacada:  true (surt en gran a la portada de Notícies) o false
#   imatge:     ruta de la fotografia principal (ex: "img/noticies/foto.jpg")
#   cartell:    (opcional) imatge secundària vertical o cartell dins el lector
#   font:       (opcional) nom de la font original
#   fontUrl:    (opcional) enllaç a la notícia original
#   resum:      resum curt per a la targeta
#   etiquetes:  llista entre claudàtors (ex: ["Edició 2027", "Sant Miquel"])
#   cos:        paràgrafs de la notícia, un per cada línia començada amb "    - "
# ============================================================================

- id: edicio-2026-escalinata
  titol: "El Davallament de Felanitx torna a emocionar els fidels en la seva 51a edició"
  categoria: "Cròniques"
  data: "3 d'abril de 2026"
  dataIso: "2026-04-03"
  lectura: "4 min"
  destacada: false
  imatge: "img/noticies/davallament-2026-ultimahora.jpg"
  font: "Ultima Hora · Gori Vicens"
  fontUrl: "https://www.ultimahora.es/noticias/local/2026/04/03/2602649/davallament-felanitx-vuelve-emocionar-fieles.html"
  resum: "Enguany s'ha celebrat la 51a edició de la representació al majestuós escenari davant l'església parroquial de Sant Miquel, amb rècord de 160 actors d'entre 3 i gairebé 80 anys."
  etiquetes: ["51a Edició", "Sant Miquel", "Divendres Sant"]
  cos:
    - "Després de l'especial Davallament de l'any passat per commemorar el 50è aniversari amb diversos escenaris diferents, enguany la representació ha tornat al seu marc habitual, l'escenari incomparable que formen l'escalinata i el replà de l'església parroquial de Sant Miquel de Felanitx. La passió i l'emotivitat de l'escenificació, que ens traslladen a les darreres hores de vida i a la crucifixió de Jesús, varen tornar a sorprendre els centenars d'espectadors que varen seguir l'acte."
    - "La representació relata alguns dels passatges més representatius de la passió de Jesús: l'Entrada Triomfal a Jerusalem, el Sant Sopar, Jesús davant Caifàs, l'«Ecce Homo», la flagel·lació i la seva presentació davant Pilat, i culmina amb la crucifixió i l'acte propi del Davallament sobre el replà parroquial. El paper de Jesús enguany va ser encarnat per Bernat Monserrat i el de la Mare de Déu per Marta Obrador."
    - "Cal destacar que enguany s'ha tornat a batre un rècord de participació amb 160 actors, tots amateurs i veïns de Felanitx d'entre 3 i gairebé 80 anys, que es varen ficar de ple en el seu paper sota la direcció de l'actor manacorí Joan Toni Sunyer. L'escenografia, juntament amb els efectes de llum i so preparats per a l'ocasió, atorguen a l'acte una aura especial."
    - "La música també hi juga un paper fonamental. La banda sonora composta i orquestrada pel músic porrerenc Joan Martorell l'any passat dona una nova dimensió sonora a cadascuna de les escenes. Aquest Divendres Sant la música i l'escenografia varen estar acompanyades per la narració de Maria Mascaró i de l'actor Miquel Gelabert, que varen oferir una sentida lectura dels textos tradicionals escrits expressament per al Davallament."
    - "Tot i que la representació en aquest emplaçament es fa des de fa 51 anys, anteriorment es celebrava a l'interior de l'església i la seva història es remunta a l'Edat Mitjana. Un cop finalitzat el Davallament, va tenir lloc la tradicional Processó de l'Enterrament, que va concloure al convent de Sant Agustí."

- id: arxiu-ciutada-digitalitzacio
  titol: "En marxa la recopilació de retalls de premsa i fotografies antigues (1975–2026)"
  categoria: "Patrimoni i Cultura"
  data: "22 de març de 2026"
  dataIso: "2026-03-22"
  lectura: "3 min"
  destacada: false
  imatge: "img/hero/hero4.jpg"
  resum: "L'Associació posa en marxa una hemeroteca digital oberta perquè les famílies felanitxeres puguin compartir records, programes i articles antics."
  etiquetes: ["Hemeroteca", "Arxiu", "Memòria"]
  cos:
    - "Amb l'objectiu de preservar la història escrita i visual del Davallament, aquest portal incorpora un arxiu de notícies de premsa on qualsevol persona pot consultar cròniques des de 1975 fins avui."
    - "Si conserves material històric a casa, ens pots escriure a davallamentfelanitx@gmail.com o a través de la pàgina de Contacte per col·laborar en la digitalització."

- id: presentacio-cartell-2026
  titol: "Presentació del cartell oficial del Davallament de Felanitx 2026"
  categoria: "Edició 2026"
  data: "19 de febrer de 2026"
  dataIso: "2026-02-19"
  lectura: "3 min"
  destacada: true
  imatge: "img/noticies/presentacio-cartell-2026.jpg"
  cartell: "img/noticies/cartell-2026.jpg"
  font: "Viu Felanitx · Ajuntament de Felanitx"
  fontUrl: "https://viufelanitx.com/art/17924/ahir-vespre-es-va-presentar-el-cartell-que-anuncia-el-davallament-de-felanitx-2026"
  resum: "Es presenta el cartell que anuncia el Davallament de Felanitx 2026, amb fotografia de Sofia Binimelis Arias i disseny gràfic de Miquel Àngel Roig Maimó."
  etiquetes: ["Cartell 2026", "Sofia Binimelis Arias", "Joan Toni Sunyer"]
  cos:
    - "El vespre del 18 de febrer de 2026 es va presentar oficialment el cartell que anuncia el Davallament de Felanitx 2026, obra fotogràfica de l'artista Sofia Binimelis Arias, que ha sabut captar amb sensibilitat i força expressiva l'essència d'aquesta representació tan arrelada al nostre poble."
    - "El disseny gràfic del cartell ha anat a càrrec de Miquel Àngel Roig Maimó."
    - "Després de la celebració del cinquantenari, el Davallament de 2026 vol donar continuïtat a aquesta fita, tot posant un èmfasi especial en la banda sonora creada expressament per a l'ocasió, així com en la consolidació dels nous elements incorporats en els darrers anys."
    - "El Davallament de Felanitx se celebra el Divendres Sant, dia 3 d'abril de 2026, a les 21:00 h, al replà de l'església parroquial de Sant Miquel, amb la direcció artística de Joan Toni Sunyer."
    - "Des de l'organització s'ha volgut expressar un agraïment especial a l'Ajuntament de Felanitx, al Centre Cultural, a la Fundació Barceló i a la Parròquia de Sant Miquel per la seva col·laboració i suport constant, que fan possible que aquesta tradició es mantingui viva any rere any."

