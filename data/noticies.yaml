  lectura: "3 min"
  destacada: false
  imatge: "img/hero/hero2.jpg"
  resum: "L'artista felanitxer va col·laborar en l'efemèride regalant a la seva vila una imatge carregada de força expressiva i simbolisme."
  etiquetes: ["Miquel Barceló", "Art", "Cartell"]
