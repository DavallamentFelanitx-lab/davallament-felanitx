  - id: cartell2025
    titol: El Davallament de Felanitx celebra 50 anys amb novetats i un cartell de Miquel Barceló
    categoria: 50è aniversari
    data: 5 de març de 2025
    dataIso: 2025-03-05
    destacada: false
    imatge: /img/noticies/cartells.jpg
    cartell: /img/noticies/pasted-image-1795693218335.png
    imatge3: /img/noticies/pasted-image-1795698535690.png
    font: Foravila.net
    fontUrl: https://www.foravila.net/cultura/el-davallament-de-felanitx-celebra-50-anys-amb-novetats-i-un-cartell-de-miquel-barcelo/
    resum: La propera Setmana Santa, la representació del Davallament de Felanitx celebrarà mig segle d’història amb una edició plena de novetats i una participació rècord de més de 200 persones. L’esdeveniment tindrà lloc el Divendres Sant, 18 d’abril, a les 21:00 h a la plaça de la Font de Santa Margalida.
    etiquetes: []
    cos:
      - La propera Setmana Santa, la representació del Davallament de Felanitx celebrarà mig segle d’història amb una edició plena de novetats i una participació rècord de més de 200 persones. L’esdeveniment tindrà lloc el Divendres Sant, 18 d’abril, a les 21:00 h a la plaça de la Font de Santa Margalida.
      - Per commemorar aquesta edició especial, el cartell ha estat dissenyat per l’artista felanitxer Miquel Barceló, un reconeixement a la importància del Davallament dins la cultura del municipi. Cartell i novetat han estat avui presentats als peus de la Parròquia de Sant Miquel.
      - El guió d’enguany és obra de la felanitxera Marta Obrador, qui també assumeix la direcció juntament amb Joan Toni Sunyer. Obrador ha explicat que aquesta edició incorpora sis escenaris repartits per tota la plaça, permetent una interacció més propera amb el públic. A més, la representació prescindirà d’un únic actor per al paper de Jesús, fet que donarà major dinamisme i fluïdesa a l’obra.
      - D’altra banda, el compositor Joan Martorell ha creat una banda sonora exclusiva per a aquesta edició, basada en instruments antics per aportar una atmosfera més autèntica. Martorell destaca la responsabilitat que suposa posar música a un dels esdeveniments més rellevants del municipi.
      - Una de les grans novetats d’aquest any és la integració del Davallament amb la processó de l’Enterrament. La Banda de Música de Felanitx i les confraries locals hi tindran un paper destacat, acompanyant un pas vivent de Jesús jacent portat a pes fins al Convent de Sant Agustí.
      - Llorenç Vadell, representant de l’organització, ha destacat l’esforç col·lectiu que fa possible el Davallament, amb el suport de l’Ajuntament de Felanitx, el Centre Cultural, la Fundació Barceló i la Parròquia de Sant Miquel. Per la seva banda, la batlessa, Catalina Soler, ha subratllat la importància de l’esdeveniment per al municipi, anunciant una aportació de 50.000 euros del pressupost municipal, a més de la col·laboració de la brigada i la Policia Local.
      - 'Els actes commemoratius comencen el 14 de març amb ‘El Fruit de la Vinya i un vi novell’, un maridatge i glossat sobre el text de P. Antoni Oliver i Monserrat a les portasses de l’hospici. El 29 de març, la Fundació Barceló acollirà la taula rodona ‘El Davallament de Felanitx: una nova perspectiva’, amb la participació d’experts en cultura i religiositat popular. Ja dins la Setmana Santa, el 14 d’abril es celebrarà el concert de música sacra ‘Un camí a les fosques’ a la capella del Roser, a càrrec de Cercle Cromàtic.'
    lectura: ''
  - id: Davallament2023
    titol: El Davallament de Felanitx se renova
    categoria: Edició 2023
    data: 3 d'abril de 2023
    dataIso: 2023-04-03
    destacada: false
    imatge: /img/noticies/pasted-image-1795730097542.png
    cartell: ''
    imatge3: ''
    font: Viufelanitx
    fontUrl: https://viufelanitx.com/art/16676/el-davallament-de-felanitx-se-renova
    resum: Divendres Sant, a les 21.00h, a l’escalinata i replà de l’Església Parroquial, tornarà a celebrar-se -després de tres anys sense fer-se- El Davallament de Felanitx.
    etiquetes: []
    cos:
      - Divendres Sant, a les 21.00h, a l’escalinata i replà de l’Església Parroquial, tornarà a celebrar-se -després de tres anys sense fer-se- El Davallament de Felanitx.
      - I ho farà amb canvis significatius. El més destacat, el canvi de direcció escènica, que enguany serà a càrrec de la felanitxera Marta Obrador Barceló.
      - Nascuda a Felanitx l’any 1985, es formà com a actriu a l’Escola d’Actors Acción- Escena a Madrid. Ha actuat en diverses obres de teatre, en cinema ha treballat en curtmetratges i ha protagonitzat espots publicitaris a la televisió a nivell nacional i internacional. També ha dirigit diverses obres de micro-teatre. A Felanitx va fundar S’Aula de Teatre on, des del 2015, ha creat nombrosos espectacles amb el seu alumnat. Actualment compagina el treball d’actriu amb el de professora.
      - Enguany hi haurà novetats importants en la posada en escena dels diferents Passos de la Passió que es representaran, en un acte en què el protagonista continua essent el poble de Felanitx, ja que El Davallament segueix el propòsit dels darrers anys de ser una entitat oberta al poble i a totes les persones que hi vulguin participar.
      - 'Les fites principals de la història del Davallament han estat:'
      - El 28 de març de 1975 es va celebrar per primera vegada al replà de l’Església Parroquial. Fins llavors s’havia representat a l’interior del temple.
      - Organitzat per la Creuada de l’Amor Diví, i gràcies al suport i l’entusiasme d’Antoni Grimalt Obrador i Lluís Bou Monserrat, el Davallament se celebrà davant l’emblemàtica portalada de la Parròquia.
      - Durant els primers anys, el Davallament es realitzava amb certa senzillesa.
      - L’acte s’obria amb el cant de diverses peces sacres interpretades per la Coral de Felanitx; tot seguit es llegia l’Evangeli, i a continuació un reconegut orador pronunciava un sermó, que es convertia en part important de la funció.
      - A partir de l’any 1987 -i de forma progressiva- s’incorporen personatges, s’afegeixen escenes de la Passió abans del davallament -que es representen a l’escalinata-, s’introdueix música sacra enregistrada –que és reproduïda per un potent equip de so– i es dota la celebració d’un complet equip de llum, incorporacions que suposen convertir la cerimònia en un espectacle.
      - L’any 1991, la representació dels personatges, a través de quadres estàtics, s’encarrega al grup de teatre Gent de Bulla, i el teatí Pare Antoni Oliver C.R. escriu uns textos específicament per al Davallament de Felanitx, que es llegeixen cada any, a fi d’acompanyar, amb la música, les diferents escenes.
      - L’any 2000 es produeixen canvis importants. L’organització es concentra en la Confraria del Sant Crist de la Bona Mort, la direcció escènica s’encarrega a Josep Lluís Fernández, i el grup d’actors passen a ser persones voluntàries de Felanitx, que -a la llarga- també portaran l’organització de facto de l’acte. Una de les novetats més destacables d’aquell any és que la figura de Jesús passa a ser interpretada per una persona i s’elimina, així, la talla amb què s’havia escenificat el davallament fins aleshores. Des del 2000, les diverses seqüències cobren més dinamisme –desapareixen quasi totes les estàtiques–, se n’afegeixen de noves, s’incorporen altres personatges, s’utilitzen nous materials i es construeixen escenaris.
      - L’any 2008 el Davallament és dirigit per Jaume Caldentey. A partir de l’any 2009, Josep Lluís Fernàndez torna a encarregar-se de la direcció escènica fins l’any 2019, darrera edició celebrada abans de la pandèmia.
      - A més de les novetats en la posada en escena, en aquest 2023 s’han renovat materials i escenaris i s’introduiran innovadors efectes sonors i luminotècnics.
      - 'Enguany es compleixen 46 anys de la seva representació a l’escalinata i replà de l’Església i El Davallament comença una nova etapa, amb canvis que persegueixen la mateixa intenció que els anteriors: donar continuïtat a un dels actes cabdals de la Setmana Santa felanitxera i dels més reconeguts de Mallorca.'
    lectura: ''
  - id: Davallament2025-Cronica
    titol: Felanitx celebra amb emoció el 50è aniversari del Davallament
    categoria: 50è aniversari
    data: 19 d'abril de 2025
    dataIso: 2025-04-19
    destacada: false
    imatge: /img/noticies/pasted-image-1795731135012.png
    cartell: ''
    imatge3: ''
    font: Canal4
    fontUrl: https://canal4diario.com/destacada/2025/04/19/felanitx-celebra-con-emocion-el-50-aniversario-del-davallament/
    resum: Felanitx va viure ahir a la nit un Divendres Sant carregat d'emoció i solemnitat amb motiu del 50è aniversari del Davallament , una de les representacions més emblemàtiques de la Setmana Santa mallorquina.
    etiquetes: []
    cos:
      - Felanitx va viure ahir a la nit un Divendres Sant carregat d'emoció i solemnitat amb motiu del 50è aniversari del Davallament, una de les representacions més emblemàtiques de la Setmana Santa mallorquina. L'escenificació, que recrea els últims moments de la vida de Jesús, va reunir més de 160 actors aficionats, tots veïns del municipi, en una edició especialment simbòlica.
      - L'habitual escalinata i el replà de l' església parroquial de Sant Miquel es van ampliar excepcionalment per a aquesta efemèride, incorporant per primera vegada tota la plaça de sa Font de Santa Margalida com a part de l'escenari. Un marc imponent que es va omplir de veïns i visitants, que van seguir en absolut silenci i amb gran respecte cadascuna de les escenes.
      - La cuidada posada en escena, reforçada per efectes especials de llum i so, i el lliurament dels participants, van aportar una aura especial i commovedora a una nit que ja és història a Felanitx. La fidelitat amb què es representa any rere any aquest acte religiós va tornar a emocionar el públic assistent.
      - "L'esdeveniment va comptar amb la presència de les principals autoritats de les Illes Balears: la presidenta del Govern, Marga Prohens, i el president del Consell de Mallorca, Llorenç Galmés, que no es van voler perdre aquesta cita tan especial per al municipi."
    lectura: ''
