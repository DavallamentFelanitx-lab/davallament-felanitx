items:
  - id: text
    etiqueta: Paraula i Dramatúrgia
    titol: El text
    imatge: /img/representacio/textDavallament.jpg
    paragrefs:
      - El text del Davallament de Felanitx combina la tradició dels textos evangèlics i litúrgics de la Setmana Santa mallorquina amb l'aportació literària creada expressament per a la nostra representació.
      - L'any 1991, el teatí pare Antoni Oliver C.R. va escriure uns textos específics per al Davallament de Felanitx que, llegits i narrats en directe, acompanyen cada quadre dramàtic i donen coherència, ritme i solemnitat a tota l'escenificació.
    cita: ''
    autorCita: ''
    audioUrl: ''
  - id: banda-sonora
    etiqueta: Música Original
    titol: La banda sonora
    imatge: /img/representacio/bandaSonora.jpg
    paragrefs:
      - Amb motiu del 50è aniversari, el Davallament va estrenar una banda sonora original composta expressament per a l'ocasió pel músic i compositor porrerenc Joan Martorell i enregistrada per la Budapest Symphony Orchestra.
      - La banda sonora del Davallament acompanya cada escena amb una música creada a mida per potenciar la força dramàtica de l'obra.
      - "L'obra compta amb la participació destacada de dues artistes felanitxeres estretament vinculades a l'acte: la veu de Mar Grimalt i el violí solista de Roser Julià."
    cita: ''
    autorCita: ''
    audioUrl: ''
